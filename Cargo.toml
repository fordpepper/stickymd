[package]
name = "stickymd"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.27.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
